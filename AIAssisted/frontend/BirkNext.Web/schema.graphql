type Query {
  ping: String
  scenarios(projectId: String!): [Scenario!]!
  reviewedCandidates(projectId: String!, sessionId: String): [ReviewedCandidate!]!
  candidateLinks(projectId: String!, sessionId: String): [CandidateLink!]!
}

type Mutation {
  createScenario(input: CreateScenarioInput!): CreateScenarioPayload!
  createScenarios(input: CreateScenariosInput!): CreateScenariosPayload!
  saveReviewedCandidates(input: SaveReviewedCandidatesInput!): SaveReviewedCandidatesPayload!
  saveCandidateLinks(input: SaveCandidateLinksInput!): SaveCandidateLinksPayload!
}

type Scenario {
  id: ID!
  title: String!
  description: String
  kind: ScenarioKind!
  projectId: String!
  createdAt: DateTime!
}

enum ScenarioKind {
  REQUIREMENT
  TEST
  NEEDS_CLARIFICATION
}

input CreateScenarioInput {
  title: String!
  description: String
  kind: ScenarioKind!
  projectId: String!
}

type CreateScenarioPayload {
  scenario: Scenario
  errors: [UserError!]!
  correlationId: String!
}

type UserError {
  field: String
  message: String!
  code: String!
}

input CreateScenariosInput {
  items: [CreateScenarioInput!]!
  extractionMetadata: ExtractionMetadataInput
}

input ExtractionMetadataInput {
  totalExtracted: Int!
  selectedCount: Int!
  extractionDurationMs: Int!
  sessionId: String!
}

type CreateScenariosPayload {
  results: [CreateScenarioResult!]!
  successCount: Int!
  failureCount: Int!
  correlationId: String!
}

union CreateScenarioResult = CreateScenarioSuccess | CreateScenarioError

type CreateScenarioSuccess {
  scenario: Scenario!
}

type CreateScenarioError {
  code: String!
  message: String!
  field: String
}

enum CandidateReviewStatus {
  NEW
  ACCEPTED
  REJECTED
  NEEDS_REVIEW
}

type ReviewedCandidate {
  id: ID!
  title: String!
  classification: ScenarioKind!
  reviewStatus: CandidateReviewStatus!
  sourceDocument: String
  sourceSection: String
  projectId: String!
  reviewedBy: String!
  sessionId: String!
  createdAt: DateTime!
  reviewedAt: DateTime
}

input SaveReviewedCandidateItemInput {
  title: String!
  classification: ScenarioKind!
  reviewStatus: CandidateReviewStatus!
  sourceDocument: String
  sourceSection: String
  projectId: String!
  reviewedBy: String
  reviewedAt: DateTime
}

input SaveReviewedCandidatesInput {
  items: [SaveReviewedCandidateItemInput!]!
  sessionId: String
}

type SaveReviewedCandidatesPayload {
  savedCount: Int!
  correlationId: String!
}

enum CandidateLinkType {
  REQUIREMENT_TEST
  REQUIREMENT_CLARIFICATION
}

type CandidateLink {
  id: ID!
  sourceCandidateRef: String!
  targetCandidateRef: String!
  linkType: CandidateLinkType!
  projectId: String!
  sessionId: String!
  createdAt: DateTime!
}

input SaveCandidateLinkItemInput {
  sourceCandidateRef: String!
  targetCandidateRef: String!
  linkType: CandidateLinkType!
}

input SaveCandidateLinksInput {
  projectId: String!
  sessionId: String!
  links: [SaveCandidateLinkItemInput!]!
}

type SaveCandidateLinksPayload {
  savedCount: Int!
  correlationId: String!
}

scalar DateTime
