name: qa-review-studio-ci

trigger:
  branches:
    include:
      - main
      - feature/*
      - bugfix/*
      - '*'

pr:
  branches:
    include:
      - main
      - feature/*
      - bugfix/*
      - '*'

pool:
  vmImage: ubuntu-latest

jobs:
- job: BuildAndPackage
  displayName: 'Build and package runnable BirkNext artifacts'
  timeoutInMinutes: 90
  steps:
    - checkout: self
      clean: true

    - bash: |
        set -euo pipefail
        required=(azure-pipelines.yml scripts/check-migrations.ps1 scripts/start-local.bat scripts/start-local.ps1 scripts/BirkNextPreflight.psm1 scripts/tests/BirkNextPreflight.Tests.ps1 \
          AIAssisted/docker-compose.yml AIAssisted/.env.example AIAssisted/backend/MIGRATION_GUIDE.md \
          AIAssisted/backend/BirkNext.sln AIAssisted/frontend/BirkNext.sln \
          AIAssisted/backend/BirkNext.Api/BirkNext.Api.csproj \
          AIAssisted/frontend/BirkNext.Web/BirkNext.Web.csproj)
        for path in "${required[@]}"; do
          test -f "$path" || { echo "Required pipeline input missing: $path"; exit 1; }
        done
        command -v dotnet
        echo "Required application projects and local startup files are present."
      displayName: 'Validate application build and packaging inputs'

    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: sdk
        version: '8.0.x'

    - bash: dotnet --info
      displayName: 'Confirm installed .NET SDK'

    # Build identity: resolved ONCE for this run (version from AIAssisted/versioning/BirkNext.Version.props, Build.BuildId, Build.BuildNumber,
    # Build.SourceVersion, Build.SourceBranch) and passed to every compilation below; nothing is recomputed per project or stage.
    - pwsh: ./scripts/tests/BirkNextBuildIdentity.Tests.ps1
      displayName: 'Build identity: resolver tests (synthetic variables only)'
      workingDirectory: .

    - pwsh: ./scripts/resolve-build-identity.ps1 -OutDir "$(Build.ArtifactStagingDirectory)/identity"
      displayName: 'Resolve the build identity (application version, run id, commit)'
      workingDirectory: .

    # Automated tests are intentionally not executed in this pipeline.
    # Restore, compilation, publish, and runnable artifact validation remain enabled.

    - script: dotnet restore BirkNext.sln
      displayName: 'Restore backend solution'
      workingDirectory: AIAssisted/backend

    - pwsh: ./scripts/tests/BirkNextPreflight.Tests.ps1
      displayName: 'Tester package preflight: runtime selection and prerequisite messages (simulated commands)'
      workingDirectory: .

    - pwsh: ./scripts/check-migrations.ps1 -ManifestOut "$(Build.ArtifactStagingDirectory)/migrations.json"
      displayName: 'Validate migration file integrity (every migrations folder) and record migration ids'
      workingDirectory: .

    - script: dotnet build BirkNext.sln --configuration Release --no-restore -p:BirkNextBuildIdentityProps="$(Build.ArtifactStagingDirectory)/identity/build-identity.props"
      displayName: 'Build backend solution'
      workingDirectory: AIAssisted/backend

    - bash: |
        set -euo pipefail
        FILE="AIAssisted/frontend/BirkNext.Web/wwwroot/BirkNext.Web.styles.css"
        if [ -f "$FILE" ]; then
          echo "Stale generated scoped CSS bundle found at $FILE. Remove it before building."
          exit 1
        fi
        echo "Scoped CSS source check passed."
      displayName: 'Check for stale frontend scoped CSS bundle'

    - script: dotnet restore BirkNext.sln
      displayName: 'Restore frontend solution'
      workingDirectory: AIAssisted/frontend

    - script: dotnet build BirkNext.sln --configuration Release --no-restore -p:BirkNextBuildIdentityProps="$(Build.ArtifactStagingDirectory)/identity/build-identity.props"
      displayName: 'Build frontend solution'
      workingDirectory: AIAssisted/frontend

    - task: Bash@3
      displayName: 'Prepare runnable artifact directories'
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          PACKAGE_DIR="$(Build.ArtifactStagingDirectory)/BirkNext"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/AIAssisted/backend" "$PACKAGE_DIR/AIAssisted/frontend" "$PACKAGE_DIR/scripts"

    - script: >-
        dotnet publish BirkNext.Api/BirkNext.Api.csproj
        --configuration Release
        --no-restore
        --output "$(Build.ArtifactStagingDirectory)/BirkNext/AIAssisted/backend"
        -p:BirkNextBuildIdentityProps="$(Build.ArtifactStagingDirectory)/identity/build-identity.props"
      displayName: 'Publish BirkNext backend'
      workingDirectory: AIAssisted/backend

    - script: >-
        dotnet publish BirkNext.Web/BirkNext.Web.csproj
        --configuration Release
        --no-restore
        --output "$(Build.ArtifactStagingDirectory)/BirkNext/AIAssisted/frontend"
        -p:BirkNextBuildIdentityProps="$(Build.ArtifactStagingDirectory)/identity/build-identity.props"
      displayName: 'Publish BirkNext Blazor WebAssembly frontend'
      workingDirectory: AIAssisted/frontend

    - task: Bash@3
      displayName: 'Package local startup support and verify runnable output'
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          PACKAGE_DIR="$(Build.ArtifactStagingDirectory)/BirkNext"

          # Publish output can include workstation profiles. Keep only the checked-in base config.
          rm -f "$PACKAGE_DIR/AIAssisted/backend/appsettings.Development.json" \
            "$PACKAGE_DIR/AIAssisted/backend/appsettings.Local.json"
          cp AIAssisted/docker-compose.yml "$PACKAGE_DIR/AIAssisted/"
          cp AIAssisted/.env.example "$PACKAGE_DIR/AIAssisted/.env.example"
          # The checked-in example contains only local development defaults required by docker-compose.
          cp AIAssisted/.env.example "$PACKAGE_DIR/AIAssisted/.env"
          cp scripts/start-local.bat scripts/start-local.ps1 scripts/BirkNextPreflight.psm1 scripts/check-migrations.ps1 scripts/validate-package.ps1 \
            scripts/BirkNextBuildIdentity.psm1 scripts/package-archive.ps1 "$PACKAGE_DIR/scripts/"
          cp AIAssisted/backend/MIGRATION_GUIDE.md "$PACKAGE_DIR/"

          cat > "$PACKAGE_DIR/README.md" <<'EOF'
          # BirkNext runnable package

          This package contains the published BirkNext backend and Blazor WebAssembly frontend.

          ## Local requirements

          - .NET 8 runtime
          - Docker Compose or Podman Compose for the local PostgreSQL container
          - Internet access on first startup if `dotnet-serve` is not already installed; the startup helper installs it to serve the static frontend

          ## Start

          From the extracted package directory, run `scripts/start-local.bat` (or `scripts/start-local.ps1`). Prerequisites: Windows, the .NET 8 ASP.NET Core Runtime, and either Podman Desktop or Docker Desktop for the database (whichever is installed and running is used automatically; force one with `-ContainerRuntime podman|docker` or `BIRKNEXT_CONTAINER_RUNTIME`). With PostgreSQL already running on port 5432, use `-SkipContainers`. Missing prerequisites are explained before anything starts. When the browser asks to connect, enter the connection code shown in the start window.

          The package includes `AIAssisted/.env` with the checked-in local development defaults. Change those values before using a shared or exposed database. The backend configuration is supplied by the published appsettings and the local startup helper; no developer secrets or machine-specific settings are packaged.

          The helper first validates this package (`scripts/validate-package.ps1`: launcher, backend and frontend runtime, configuration templates, every packaged file, and every EF Core migration compiled into `BirkNext.Api.dll`), then starts PostgreSQL, runs `AIAssisted/backend/BirkNext.Api.dll`, and serves `AIAssisted/frontend/wwwroot` on port 5173. The package needs no source `Data/Migrations` folder.

          Extract the package to a short folder (for example `C:\BirkNext`): Windows limits file paths to 260 characters.
          EOF

          BACKEND="$PACKAGE_DIR/AIAssisted/backend"
          FRONTEND="$PACKAGE_DIR/AIAssisted/frontend/wwwroot"
          test -s "$BACKEND/BirkNext.Api.dll"
          test -s "$BACKEND/BirkNext.Api.deps.json"
          test -s "$BACKEND/BirkNext.Api.runtimeconfig.json"
          test -s "$BACKEND/appsettings.json"
          test ! -e "$BACKEND/appsettings.Development.json"
          test ! -e "$BACKEND/appsettings.Local.json"
          test -s "$FRONTEND/index.html"
          test -d "$FRONTEND/_framework"
          find "$FRONTEND/_framework" -type f -print -quit | grep -q .
          test -s "$PACKAGE_DIR/AIAssisted/docker-compose.yml"
          test -s "$PACKAGE_DIR/AIAssisted/.env"
          test -s "$PACKAGE_DIR/scripts/start-local.ps1"
          test -s "$PACKAGE_DIR/scripts/check-migrations.ps1"
          test -s "$PACKAGE_DIR/scripts/validate-package.ps1"

          # Build manifest: the run's identity plus the versions read from the compiled backend, frontend and bundled Companion; fails when
          # they disagree. Then the package manifest: every packaged file with its SHA-256 and every EF Core migration id the source holds.
          pwsh -NoProfile -File scripts/write-build-manifest.ps1 -IdentityFile "$(Build.ArtifactStagingDirectory)/identity/build-identity.json" -PackageRoot "$PACKAGE_DIR"
          pwsh -NoProfile -File "$PACKAGE_DIR/scripts/validate-package.ps1" -CreateManifest \
            -MigrationManifest "$(Build.ArtifactStagingDirectory)/migrations.json" -SourceCommit "$(Build.SourceVersion)"
          # Validate an untouched copy in a clean folder, exactly as a tester would receive it.
          CLEAN_DIR="$(Agent.TempDirectory)/package-clean"
          rm -rf "$CLEAN_DIR" && mkdir -p "$CLEAN_DIR"
          cp -r "$PACKAGE_DIR" "$CLEAN_DIR/"
          pwsh -NoProfile -File "$CLEAN_DIR/BirkNext/scripts/validate-package.ps1" -PackageRoot "$CLEAN_DIR/BirkNext" -RequireBuildManifest

          echo "Runnable package verified. Key files:"
          printf '%s\n' \
            "$BACKEND/BirkNext.Api.dll" \
            "$BACKEND/BirkNext.Api.deps.json" \
            "$BACKEND/BirkNext.Api.runtimeconfig.json" \
            "$BACKEND/appsettings.json" \
            "$FRONTEND/index.html" \
            "$FRONTEND/_framework" \
            "$PACKAGE_DIR/AIAssisted/docker-compose.yml" \
            "$PACKAGE_DIR/AIAssisted/.env" \
            "$PACKAGE_DIR/scripts/start-local.ps1"
          echo "Artifact file count: $(find "$PACKAGE_DIR" -type f | wc -l)"

    # A candidate only: testers get the package after the Windows smoke test below has passed.
    - task: PublishPipelineArtifact@1
      displayName: 'Publish BirkNext tester package candidate'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/BirkNext'
        artifact: 'birknext-tester-package-candidate'
        publishLocation: 'pipeline'

- job: SmokeTestTesterPackage
  displayName: 'Smoke test the tester package on a clean Windows machine, then publish it'
  dependsOn: BuildAndPackage
  pool:
    vmImage: windows-latest
  timeoutInMinutes: 30
  steps:
    - checkout: none

    - task: UseDotNet@2
      displayName: 'Install .NET (the launcher requires dotnet)'
      inputs:
        packageType: sdk
        version: '8.0.x'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download tester package candidate'
      inputs:
        artifact: 'birknext-tester-package-candidate'
        path: '$(Pipeline.Workspace)/candidate'

    - powershell: |
        $ErrorActionPreference = "Stop"
        # Unpack to a clean, short folder (as a tester should) and run the tester's own entry points with Windows PowerShell.
        $clean = "C:\bn-smoke"
        if (Test-Path $clean) { Remove-Item -Recurse -Force $clean }
        Copy-Item -Recurse "$(Pipeline.Workspace)\candidate" $clean
        powershell -NoProfile -ExecutionPolicy Bypass -File "$clean\scripts\validate-package.ps1" -RequireBuildManifest
        if ($LASTEXITCODE -ne 0) { throw "Tester package validation failed." }
        powershell -NoProfile -ExecutionPolicy Bypass -File "$clean\scripts\start-local.ps1" -ValidateOnly -SkipContainers
        if ($LASTEXITCODE -ne 0) { throw "start-local.ps1 -ValidateOnly failed on the tester package." }
      displayName: 'Validate the package and the launcher preflight from a clean folder'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish BirkNext tester package (validated)'
      inputs:
        targetPath: '$(Pipeline.Workspace)/candidate'
        artifact: 'birknext-tester-package'
        publishLocation: 'pipeline'

    # The downloadable, visibly versioned archive: BirkNext-<build version>.zip (name from the package's build-manifest.json) and its
    # SHA-256 in a separate .sha256 file, computed after the archive is final. The artifact name stays stable for consumers.
    - powershell: |
        $ErrorActionPreference = "Stop"
        $out = "$(Build.ArtifactStagingDirectory)\archive"
        powershell -NoProfile -ExecutionPolicy Bypass -File "C:\bn-smoke\scripts\package-archive.ps1" -PackageRoot "$(Pipeline.Workspace)\candidate" -OutDir $out
        if ($LASTEXITCODE -ne 0) { throw "Creating the versioned archive failed." }
        $zip = Get-ChildItem $out -Filter "BirkNext-*.zip" | Select-Object -First 1
        powershell -NoProfile -ExecutionPolicy Bypass -File "C:\bn-smoke\scripts\package-archive.ps1" -Verify -Archive $zip.FullName -ExtractTo "C:\bn-archive-check"
        if ($LASTEXITCODE -ne 0) { throw "The versioned archive did not verify after extraction." }
      displayName: 'Create the versioned archive and its SHA-256, then verify a fresh extraction'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish BirkNext versioned archive and checksum'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/archive'
        artifact: 'birknext-tester-package-archive'
        publishLocation: 'pipeline'

# Windows Tester Package (TesterNative runtime profile): self-contained backend and launcher, the frontend, the pinned native PostgreSQL and k6
# from AIAssisted/versioning/native-runtime.lock.json (official upstream URLs, SHA-256 verified; nothing else is accepted), licenses and
# manifests, archived as BirkNext-Tester-Windows-x64-<build version>.zip. The existing package above is unchanged. The isolated startup check
# runs the packaged launcher against a throwaway data folder on the agent (first-run database, migrations, health, clean stop).
- job: BuildWindowsTesterPackage
  displayName: 'Build, start-check and publish the Windows Tester Package (TesterNative)'
  pool:
    vmImage: windows-latest
  timeoutInMinutes: 60
  steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: sdk
        version: '8.0.x'

    - pwsh: ./scripts/resolve-build-identity.ps1 -OutDir "$(Build.ArtifactStagingDirectory)/identity"
      displayName: 'Resolve the build identity'

    - pwsh: |
        ./scripts/build-tester-package.ps1 -OutDir "$(Build.ArtifactStagingDirectory)/tester" -DownloadCache "$(Agent.TempDirectory)/native-runtime" `
          -IdentityFile "$(Build.ArtifactStagingDirectory)/identity/build-identity.json" -AllowDownload
        if ($LASTEXITCODE -ne 0) { throw "Tester package build failed ($LASTEXITCODE)." }
      displayName: 'Build the Tester Package from pinned inputs'

    - powershell: |
        $ErrorActionPreference = "Stop"
        $zip = Get-ChildItem "$(Build.ArtifactStagingDirectory)\tester\archive" -Filter "BirkNext-Tester-Windows-x64-*.zip" | Select-Object -First 1
        powershell -NoProfile -ExecutionPolicy Bypass -File ".\scripts\package-archive.ps1" -Verify -Archive $zip.FullName
        if ($LASTEXITCODE -ne 0) { throw "Archive checksum failed." }
        $clean = "C:\bn-tester"; $data = "C:\bn-tester-data"
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        [IO.Compression.ZipFile]::ExtractToDirectory($zip.FullName, $clean)
        & "$clean\Start-BirkNext.exe" --validate --data-dir $data
        if ($LASTEXITCODE -ne 0) { throw "Start-BirkNext.exe --validate failed." }
        & "$clean\Start-BirkNext.exe" --no-browser --data-dir $data --exit-after 15
        if ($LASTEXITCODE -ne 0) { throw "Start-BirkNext.exe did not start and stop cleanly." }
        if (-not (Test-Path "$data\config\cluster.json")) { throw "No database cluster was created." }
      displayName: 'Offline package inspection and isolated startup check'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish the Windows Tester Package archive and checksum'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/tester/archive'
        artifact: 'birknext-windows-tester-package'
        publishLocation: 'pipeline'
