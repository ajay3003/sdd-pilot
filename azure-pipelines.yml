name: qa-review-studio-ci

trigger:
  branches:
    include:
      - main
      - feature/*
      - bugfix/*
      - '*'

pr:
  branches:
    include:
      - main
      - feature/*
      - bugfix/*
      - '*'

pool:
  vmImage: ubuntu-latest

variables:
- group: birknext-ci
- name: CI_CONTAINER_RUNTIME
  value: docker

jobs:
- job: QualityGates
  displayName: 'BirkNext required quality gates'
  timeoutInMinutes: 240
  steps:
    - checkout: self
      clean: true

    - bash: |
        set -euo pipefail
        mkdir -p "$(Agent.TempDirectory)/test-results/"{backend,frontend,frontend-playwright,browser-runtime,accessibility,lighthouse,security} \
          "$(Agent.TempDirectory)/pipeline-diagnostics"
        required=(azure-pipelines.yml AIAssisted/docker-compose.yml scripts/check-migrations.ps1 \
          AIAssisted/scripts/run-frontend-quality-phase2e-tests.ps1 \
          AIAssisted/scripts/run-frontend-quality-phase2e-real-tests.ps1 \
          AIAssisted/scripts/run-frontend-zap-passive-tests.ps1 \
          AIAssisted/scripts/run-frontend-browser-runtime-tests.ps1 \
          AIAssisted/scripts/run-frontend-accessibility-tests.ps1 \
          AIAssisted/scripts/run-frontend-lighthouse-tests.ps1 \
          AIAssisted/backend/BirkNext.sln AIAssisted/frontend/BirkNext.sln \
          AIAssisted/backend/BirkNext.Api/BirkNext.Api.csproj \
          AIAssisted/frontend/BirkNext.Web/BirkNext.Web.csproj \
          AIAssisted/frontend/BirkNext.Web.Tests/BirkNext.Web.Tests.csproj \
          scripts/start-local.bat scripts/start-local.ps1 \
          AIAssisted/frontend/BirkNext.Web.PlaywrightTests/BirkNext.Web.PlaywrightTests.csproj)
        for path in "${required[@]}"; do
          test -f "$path" || { echo "Required pipeline input missing: $path"; exit 1; }
        done
        echo "Required pipeline scripts and project paths are present."
        if [[ "$(CI_CONTAINER_RUNTIME)" != docker ]]; then
          echo "Hosted CI container runtime must be docker; got $(CI_CONTAINER_RUNTIME)."
          exit 1
        fi
        docker --version
        docker compose version
        command -v dotnet
      displayName: 'VALIDATE - pipeline inputs and agent tools'

    - bash: |
        echo "Branch: $(Build.SourceBranch)"
        echo "Commit: $(Build.SourceVersion)"
        echo "Agent: $(Agent.Name)"
        echo "PUBLISH_TESTER_PACKAGE=$(PUBLISH_TESTER_PACKAGE)"
      displayName: 'Pipeline configuration'
      condition: succeeded()

    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: sdk
        version: '8.0.x'

    - bash: dotnet --info
      displayName: 'Confirm installed .NET SDK'
      condition: succeeded()

    - bash: |
        set -e
        : "${POSTGRES_DB:?POSTGRES_DB pipeline variable is required}"
        : "${POSTGRES_USER:?POSTGRES_USER pipeline variable is required}"
        : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD pipeline variable is required}"
        cat > AIAssisted/.env << EOF
        POSTGRES_DB=$POSTGRES_DB
        POSTGRES_USER=$POSTGRES_USER
        POSTGRES_PASSWORD=$POSTGRES_PASSWORD
        EOF
        echo "Created AIAssisted/.env"
      displayName: 'Create CI .env'
      env:
        POSTGRES_DB: $(POSTGRES_DB)
        POSTGRES_USER: $(POSTGRES_USER)
        POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)

    - bash: |
        set -e
        "$(CI_CONTAINER_RUNTIME)" compose up -d
        "$(CI_CONTAINER_RUNTIME)" compose ps
      displayName: 'Start PostgreSQL container'
      workingDirectory: AIAssisted

    - bash: |
        set -e
        echo "Waiting for PostgreSQL healthcheck..."

        for i in {1..30}; do
          HEALTH=$("$(CI_CONTAINER_RUNTIME)" inspect --format='{{.State.Health.Status}}' $("$(CI_CONTAINER_RUNTIME)" compose ps -q postgres) 2>/dev/null || echo "unknown")
          echo "Attempt $i: PostgreSQL health = $HEALTH"

          if [ "$HEALTH" = "healthy" ]; then
            echo "PostgreSQL is healthy"
            "$(CI_CONTAINER_RUNTIME)" compose ps
            exit 0
          fi

          sleep 5
        done

        echo "PostgreSQL did not become healthy in time"
        "$(CI_CONTAINER_RUNTIME)" compose logs postgres
        "$(CI_CONTAINER_RUNTIME)" compose ps
        exit 1
      displayName: 'Wait for PostgreSQL'
      workingDirectory: AIAssisted

    # -------------------------
    # Backend
    # -------------------------

    - script: dotnet restore BirkNext.sln
      displayName: 'Restore backend solution'
      workingDirectory: AIAssisted/backend
      condition: succeeded()

    - pwsh: |
        if (-not (Test-Path "./scripts/check-migrations.ps1")) {
          Write-Error "Migration integrity check script not found: ./scripts/check-migrations.ps1"
          exit 1
        }

        ./scripts/check-migrations.ps1
      displayName: 'VALIDATE - pipeline inputs and agent tools'
      condition: succeeded()

    - script: dotnet build BirkNext.sln --configuration Release --no-restore
      displayName: 'Build backend solution'
      workingDirectory: AIAssisted/backend
      condition: succeeded()

    - script: |
        dotnet test BirkNext.sln \
          --configuration Release \
          --no-build \
          --blame-hang-timeout 5m \
          --blame-hang-dump-type none \
          --diag $(Agent.TempDirectory)/pipeline-diagnostics/backend-vstest.diag.log \
          --logger trx \
          --results-directory $(Agent.TempDirectory)/test-results/backend
      displayName: 'Run backend tests'
      workingDirectory: AIAssisted/backend
      condition: succeeded()
      timeoutInMinutes: 40

    - script: |
        dotnet publish BirkNext.Api/BirkNext.Api.csproj \
          --configuration Release \
          --output $(Build.ArtifactStagingDirectory)/tester-package/AIAssisted/backend
      displayName: 'Publish backend app'
      workingDirectory: AIAssisted/backend
      condition: succeeded()

    - bash: |
        set -e
        echo "Backend published files:"
        ls -la "$(Build.ArtifactStagingDirectory)/tester-package/AIAssisted/backend"

        echo "Checking backend runnable DLL..."
        test -f "$(Build.ArtifactStagingDirectory)/tester-package/AIAssisted/backend/BirkNext.Api.dll"

        echo "Checking backend runtimeconfig..."
        test -f "$(Build.ArtifactStagingDirectory)/tester-package/AIAssisted/backend/BirkNext.Api.runtimeconfig.json"

        echo "Backend publish verification OK"
      displayName: 'Verify backend publish'
      condition: succeeded()

    # -------------------------
    # Frontend
    # Blazor WebAssembly is static output, not a runnable dotnet server app.
    # -------------------------

    - bash: |
        set -e
        FILE="AIAssisted/frontend/BirkNext.Web/wwwroot/BirkNext.Web.styles.css"
        if [ -f "$FILE" ]; then
          echo "ERROR: Stale scoped CSS bundle exists at $FILE"
          echo "This file is generated by Blazor during build and must not exist in wwwroot."
          echo "A physical copy causes Static Web Assets collision: InvalidOperationException - Sequence contains more than one element"
          echo "Remove the file and rebuild."
          exit 1
        fi
        echo "âœ“ Scoped CSS stale file guard passed"
      displayName: 'Check for stale scoped CSS bundle'
      condition: succeeded()

    - script: dotnet restore BirkNext.sln
      displayName: 'Restore frontend solution'
      workingDirectory: AIAssisted/frontend
      condition: succeeded()

    - script: dotnet build BirkNext.sln --configuration Release --no-restore
      displayName: 'Build frontend solution'
      workingDirectory: AIAssisted/frontend
      condition: succeeded()

    - script: |
        dotnet test BirkNext.Web.Tests/BirkNext.Web.Tests.csproj \
          --configuration Release \
          --no-build \
          --logger trx \
          --results-directory $(Agent.TempDirectory)/test-results/frontend
      displayName: 'Run frontend tests'
      workingDirectory: AIAssisted/frontend
      condition: succeeded()
      timeoutInMinutes: 30

    - pwsh: ./scripts/run-frontend-quality-phase2e-tests.ps1
      displayName: 'Run frontend Phase 2E aggregate coverage guard'
      workingDirectory: AIAssisted
      condition: succeeded()

    - script: |
        dotnet publish BirkNext.Web/BirkNext.Web.csproj \
          --configuration Release \
          --output $(Build.ArtifactStagingDirectory)/tester-package/AIAssisted/frontend
      displayName: 'Publish frontend Blazor WebAssembly app'
      workingDirectory: AIAssisted/frontend
      condition: succeeded()

    - bash: |
        set -e
        FRONTEND_DIR="$(Build.ArtifactStagingDirectory)/tester-package/AIAssisted/frontend"

        echo "Frontend published files:"
        find "$FRONTEND_DIR" -maxdepth 3 -type f -print | sort

        echo "Checking Blazor WebAssembly static output..."
        if [ -f "$FRONTEND_DIR/wwwroot/index.html" ]; then
          echo "Found wwwroot/index.html"
        elif [ -f "$FRONTEND_DIR/index.html" ]; then
          echo "Found index.html"
        else
          echo "ERROR: No Blazor index.html found in published frontend output"
          exit 1
        fi

        echo "Frontend publish verification OK"
      displayName: 'Verify frontend Blazor WebAssembly publish'
      condition: succeeded()

    # -------------------------------------------------------
    # Frontend Passive Security (Phase 2D)
    # Real OWASP ZAP 2.16.1 passive scanning gate
    # -------------------------------------------------------

    - bash: |
        set -e
        echo "Checking container runtime availability..."
        RUNTIME="$(CI_CONTAINER_RUNTIME)"
        command -v "$RUNTIME"
        "$RUNTIME" --version
        "$RUNTIME" compose version
        echo "Using container runtime: $RUNTIME"
      displayName: 'Verify container runtime'
      condition: succeeded()

    - bash: |
        set -e
        RUNTIME="$(CI_CONTAINER_RUNTIME)"
        mkdir -p "$(Agent.TempDirectory)/pipeline-diagnostics"

        ZAP_IMAGE="ghcr.io/zaproxy/zaproxy:2.16.1"
        echo "Pulling ZAP image: $ZAP_IMAGE"
        $RUNTIME pull "$ZAP_IMAGE"
        $RUNTIME image inspect "$ZAP_IMAGE" --format "Digest: {{index .RepoDigests 0}}" | tee "$(Agent.TempDirectory)/pipeline-diagnostics/zap-image.txt"
      displayName: 'Pull pinned ZAP image'
      condition: succeeded()

    - pwsh: ./scripts/run-frontend-zap-passive-tests.ps1 "Category=FrontendZapPassiveIntegration"
      displayName: 'Run frontend passive-security gate (ZAP Phase 2D)'
      workingDirectory: AIAssisted
      condition: succeeded()
      env:
        FrontendPassiveSecurity__ContainerRuntime: $(CI_CONTAINER_RUNTIME)
        RUN_EXTERNAL_FRONTEND_QUALITY_TESTS: 'true'
        TEST_RESULTS_DIRECTORY: $(Agent.TempDirectory)/test-results/security
      timeoutInMinutes: 40

    # -------------------------------------------------------
    # Frontend Playwright E2E Tests (Quality Gate)
    # Blocks pipeline on WASM runtime regressions
    # -------------------------------------------------------

    - bash: |
        set -e
        echo "Starting backend with correct environment..."
        DIAG="$(Agent.TempDirectory)/pipeline-diagnostics"
        mkdir -p "$DIAG"
        setsid dotnet run --project BirkNext.Api/BirkNext.Api.csproj --configuration Release > "$DIAG/backend.log" 2>&1 < /dev/null &
        echo $! > "$DIAG/backend.pid"
      displayName: 'Start backend service'
      workingDirectory: AIAssisted/backend
      condition: succeeded()
      env:
        ASPNETCORE_URLS: 'http://localhost:5000'
        ASPNETCORE_ENVIRONMENT: 'Development'
        ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)'

    - bash: |
        set -e
        echo "Waiting for backend HTTP readiness..."
        for i in {1..60}; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/sample-projects 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "âœ“ Backend ready (HTTP 200)"
            exit 0
          fi
          echo "Attempt $i/60: HTTP $HTTP_CODE"
          sleep 1
        done
        echo "âœ— Backend not ready after 60 seconds"
        cat "$(Agent.TempDirectory)/pipeline-diagnostics/backend.log" || echo "(log not found)"
        exit 1
      displayName: 'Wait for backend readiness'
      condition: succeeded()

    - bash: |
        set -e
        echo "Starting frontend with correct environment..."
        DIAG="$(Agent.TempDirectory)/pipeline-diagnostics"
        mkdir -p "$DIAG"
        setsid dotnet run --project BirkNext.Web/BirkNext.Web.csproj --configuration Release > "$DIAG/frontend.log" 2>&1 < /dev/null &
        echo $! > "$DIAG/frontend.pid"
      displayName: 'Start frontend service'
      workingDirectory: AIAssisted/frontend
      condition: succeeded()
      env:
        ASPNETCORE_URLS: 'http://localhost:5173'
        ASPNETCORE_ENVIRONMENT: 'Development'

    - bash: |
        set -e
        echo "Waiting for frontend HTTP readiness..."
        for i in {1..30}; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/ 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "âœ“ Frontend ready (HTTP 200)"
            exit 0
          fi
          echo "Attempt $i/30: HTTP $HTTP_CODE"
          sleep 1
        done
        echo "âœ— Frontend not ready after 30 seconds"
        cat "$(Agent.TempDirectory)/pipeline-diagnostics/frontend.log" || echo "(log not found)"
        exit 1
      displayName: 'Wait for frontend readiness'
      condition: succeeded()

    - bash: |
        set -e
        echo "Installing Playwright browsers..."
        pwsh BirkNext.Web.PlaywrightTests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium
      displayName: 'Install Playwright browsers'
      workingDirectory: AIAssisted/frontend
      condition: succeeded()
      timeoutInMinutes: 20

    - pwsh: ./scripts/run-frontend-browser-runtime-tests.ps1
      displayName: 'Run frontend browser runtime tests'
      workingDirectory: AIAssisted
      condition: succeeded()
      timeoutInMinutes: 15
      env:
        RUN_EXTERNAL_FRONTEND_QUALITY_TESTS: 'true'
        TEST_RESULTS_DIRECTORY: $(Agent.TempDirectory)/test-results/browser-runtime

    - pwsh: ./scripts/run-frontend-accessibility-tests.ps1
      displayName: 'Run frontend axe-core accessibility tests'
      workingDirectory: AIAssisted
      condition: succeeded()
      timeoutInMinutes: 15
      env:
        RUN_EXTERNAL_FRONTEND_QUALITY_TESTS: 'true'
        TEST_RESULTS_DIRECTORY: $(Agent.TempDirectory)/test-results/accessibility

    - task: UseNode@1
      displayName: 'Install pinned Node.js major for Lighthouse'
      inputs:
        version: '20.x'
      condition: succeeded()
      timeoutInMinutes: 10

    - bash: |
        set -euo pipefail
        npm ci --ignore-scripts
      displayName: 'Install pinned Lighthouse runner dependencies'
      workingDirectory: AIAssisted/backend/BirkNext.Api/Tools/LighthouseRunner
      condition: succeeded()
      timeoutInMinutes: 10

    - pwsh: ./scripts/run-frontend-lighthouse-tests.ps1
      displayName: 'Run frontend Lighthouse lab tests'
      workingDirectory: AIAssisted
      condition: succeeded()
      timeoutInMinutes: 20
      env:
        RUN_EXTERNAL_FRONTEND_QUALITY_TESTS: 'true'
        TEST_RESULTS_DIRECTORY: $(Agent.TempDirectory)/test-results/lighthouse

    - pwsh: ./scripts/run-frontend-quality-phase2e-real-tests.ps1
      displayName: 'Run frontend Phase 2E real aggregate acceptance'
      workingDirectory: AIAssisted
      condition: succeeded()
      timeoutInMinutes: 10
      env:
        RUN_EXTERNAL_FRONTEND_QUALITY_TESTS: 'true'
        TEST_RESULTS_DIRECTORY: $(Agent.TempDirectory)/test-results/frontend-playwright-phase2e

    - bash: |
        set -euo pipefail
        PROJECT="BirkNext.Web.PlaywrightTests/BirkNext.Web.PlaywrightTests.csproj"
        FILTER="Category=PreStarted"

        # The CI-specific source file is selected at compile time. Build that exact
        # variant before discovery because the solution build uses the default variant.
        dotnet build "$PROJECT" \
          --configuration Release \
          --no-restore \
          --no-dependencies \
          -p:RunPreStartedPlaywrightTests=true

        DISCOVERY_OUTPUT="$(mktemp)"
        trap 'rm -f "$DISCOVERY_OUTPUT"' EXIT
        dotnet test "$PROJECT" \
          --configuration Release \
          --no-build \
          -p:RunPreStartedPlaywrightTests=true \
          --list-tests \
          --filter "$FILTER" | tee "$DISCOVERY_OUTPUT"

        SELECTED_COUNT=$(grep -Ec '^[[:space:]]+BirkNext\.Web\.PlaywrightTests\.' "$DISCOVERY_OUTPUT" || true)
        echo "Selected tests: $SELECTED_COUNT"
        if [ "$SELECTED_COUNT" -eq 0 ]; then
          echo "ERROR: Playwright Quality Gate selected 0 tests."
          exit 1
        fi

        dotnet test "$PROJECT" \
          --configuration Release \
          --no-build \
          -p:RunPreStartedPlaywrightTests=true \
          --logger trx \
          --results-directory $(Agent.TempDirectory)/test-results/frontend-playwright \
          --filter "$FILTER"
      displayName: 'Run frontend Playwright E2E tests (Quality Gate)'
      workingDirectory: AIAssisted/frontend
      condition: succeeded()
      timeoutInMinutes: 5
      env:
        TEST_RESULTS_DIRECTORY: $(Agent.TempDirectory)/test-results/frontend-playwright

    - bash: |
        set +e
        DIAG="$(Agent.TempDirectory)/pipeline-diagnostics"
        for name in backend frontend; do
          pidfile="$DIAG/$name.pid"
          if [ -f "$pidfile" ]; then
            pid=$(cat "$pidfile")
            kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
            for i in {1..10}; do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            kill -KILL -- "-$pid" 2>/dev/null || true
            if kill -0 -- "-$pid" 2>/dev/null; then
              echo "##vso[task.logissue type=warning]Could not confirm cleanup of the owned $name process group (PID $pid)."
            fi
          fi
        done
        echo "Owned backend and frontend process groups stopped."
      displayName: 'CLEANUP — stop owned services'
      condition: always()

    - bash: |
        set +e
        DIAG="$(Agent.TempDirectory)/pipeline-diagnostics"
        RUNTIME="$(CI_CONTAINER_RUNTIME)"
        mkdir -p "$DIAG"
        "$RUNTIME" compose logs --no-color postgres > "$DIAG/postgres.log" 2>&1 || true
        containers=$("$RUNTIME" ps -aq --filter label=birknext.engine=zap-passive-test)
        if [ -n "$containers" ]; then "$RUNTIME" rm --force $containers || echo "##vso[task.logissue type=warning]Could not remove all labeled ZAP fixture containers."; fi
        networks=$("$RUNTIME" network ls -q --filter label=birknext.engine=zap-passive-test)
        if [ -n "$networks" ]; then "$RUNTIME" network rm $networks || echo "##vso[task.logissue type=warning]Could not remove all labeled ZAP fixture networks."; fi
        if ! "$RUNTIME" compose down -v; then
          echo "##vso[task.logissue type=warning]CI container cleanup failed; inspect pipeline-diagnostics/postgres.log."
        fi
        rm -f .env
      displayName: 'CLEANUP — capture database log and remove containers'
      condition: always()
      workingDirectory: AIAssisted

    - pwsh: |
        $resultsRoot = "$(Agent.TempDirectory)/test-results"
        $diagRoot = "$(Agent.TempDirectory)/pipeline-diagnostics"
        New-Item -ItemType Directory -Force -Path $diagRoot | Out-Null
        Get-ChildItem -Path $diagRoot -File -ErrorAction SilentlyContinue |
          Where-Object { $_.Extension -eq '.log' -or $_.Name -match '\.diag\.' } |
          ForEach-Object {
            $content = Get-Content -Raw -LiteralPath $_.FullName -ErrorAction SilentlyContinue
            if ($null -ne $content) {
              if ($env:POSTGRES_PASSWORD) { $content = $content.Replace($env:POSTGRES_PASSWORD, '[REDACTED]') }
              $content = [regex]::Replace($content, '(?i)(password\s*=\s*)[^;\s]+', '$1[REDACTED]')
              Set-Content -LiteralPath $_.FullName -Value $content -NoNewline -Encoding utf8
            }
          }
        Get-ChildItem -Path $resultsRoot -Recurse -File -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -match 'Sequence| blame|\.diag\.' } |
          Copy-Item -Destination $diagRoot -Force
        $resultFiles = @(Get-ChildItem -Path $resultsRoot -Recurse -File -Filter '*.trx' -ErrorAction SilentlyContinue | ForEach-Object {
          [ordered]@{ area = $_.Directory.Name; format = 'trx'; path = $_.FullName.Substring($resultsRoot.Length + 1).Replace('\', '/') }
        })
        [ordered]@{
          schemaVersion = 1
          pipeline = 'qa-review-studio-ci'
          buildId = '$(Build.BuildId)'
          sourceVersion = '$(Build.SourceVersion)'
          sourceBranch = '$(Build.SourceBranch)'
          results = $resultFiles
        } | ConvertTo-Json -Depth 6 | Set-Content -Path (Join-Path $resultsRoot 'birknext-test-evidence-manifest.json') -Encoding utf8
      displayName: 'PUBLISH — assemble evidence manifest and diagnostics'
      condition: always()
      env:
        POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)

    # -------------------------
    # Test results
    # -------------------------

    - task: PublishTestResults@2
      displayName: 'PUBLISH — all test results'
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '**/*.trx'
        searchFolder: '$(Agent.TempDirectory)/test-results'
        failTaskOnFailedTests: false
        testRunTitle: 'BirkNext CI — $(Build.BuildId)'

    # -------------------------
    # Tester package
    # -------------------------

    - bash: |
        set -e

        PACKAGE_DIR="$(Build.ArtifactStagingDirectory)/tester-package"

        echo "Preparing tester package at: $PACKAGE_DIR"

        mkdir -p "$PACKAGE_DIR/scripts"
        mkdir -p "$PACKAGE_DIR/AIAssisted"
        mkdir -p "$PACKAGE_DIR/test-results"

        echo "Repository root:"
        pwd

        echo "Repository root contents:"
        ls -la

        echo "AIAssisted contents:"
        ls -la AIAssisted

        echo "Scripts folder contents:"
        ls -la scripts

        echo "Copying docker-compose.yml to AIAssisted..."
        cp AIAssisted/docker-compose.yml "$PACKAGE_DIR/AIAssisted/"

        echo "Copying .env.example if available..."
        cp AIAssisted/.env.example "$PACKAGE_DIR/AIAssisted/" || echo ".env.example not found, skipping"

        echo "Copying local start scripts..."
        cp scripts/start-local.bat "$PACKAGE_DIR/scripts/"
        cp scripts/start-local.ps1 "$PACKAGE_DIR/scripts/"

        echo "Copying migration check script..."
        cp scripts/check-migrations.ps1 "$PACKAGE_DIR/scripts/"

        echo "Copying migration guide documentation..."
        if [ -f AIAssisted/backend/MIGRATION_GUIDE.md ]; then
          cp AIAssisted/backend/MIGRATION_GUIDE.md "$PACKAGE_DIR/"
        else
          echo "Migration guide not found, skipping"
        fi

        echo "Copying test results if available..."
        cp -r "$(Agent.TempDirectory)/test-results"/* "$PACKAGE_DIR/test-results/" || echo "No test results found, skipping"

        cat > "$PACKAGE_DIR/README.md" << 'EOF'
        # BirkNext Studio Tester Package

        Download and unzip this artifact.

        ## Start locally

        Run:

        ```text
        scripts/start-local.bat
        ```

        or:

        ```text
        scripts/start-local.ps1
        ```

        ## Database Migrations

        Before modifying the database schema, always consult:

        ```text
        MIGRATION_GUIDE.md
        ```

        Validate migrations before committing:

        ```powershell
        .\scripts\check-migrations.ps1
        ```

        ## Expected structure

        ```text
        AIAssisted/
          backend/
            BirkNext.Api.dll
            BirkNext.Api.runtimeconfig.json
          frontend/
            wwwroot/index.html
          docker-compose.yml

        scripts/
          start-local.bat
          start-local.ps1
          check-migrations.ps1

        MIGRATION_GUIDE.md
        ```

        ## Important

        - Backend is a runnable ASP.NET Core app.
        - Frontend is Blazor WebAssembly static output.
        - Do not run `dotnet BirkNext.Web.dll`.
        - The local script should serve the frontend static files and start the backend.
        - Always validate migrations with `check-migrations.ps1` before committing.
        EOF

        echo "Final tester package contents:"
        find "$PACKAGE_DIR" -maxdepth 5 -type f -print | sort
      displayName: 'Prepare tester package'
      condition: and(succeeded(), eq(variables['PUBLISH_TESTER_PACKAGE'], 'true'))

    - task: PublishPipelineArtifact@1
      displayName: 'Publish tester package'
      condition: and(succeeded(), eq(variables['PUBLISH_TESTER_PACKAGE'], 'true'))
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/tester-package'
        artifact: 'birknext-tester-package'
        publishLocation: 'pipeline'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish test artifacts'
      condition: always()
      inputs:
        PathtoPublish: '$(Agent.TempDirectory)/test-results'
        ArtifactName: 'test-results'
        publishLocation: Container

    - task: PublishPipelineArtifact@1
      displayName: 'PUBLISH — pipeline diagnostics'
      condition: always()
      inputs:
        targetPath: '$(Agent.TempDirectory)/pipeline-diagnostics'
        artifact: 'pipeline-diagnostics'
        publishLocation: 'pipeline'

    # -------------------------
    # Cleanup
    # -------------------------
