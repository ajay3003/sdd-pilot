name: qa-review-studio-ci

trigger:
  branches:
    include:
      - main
      - feature/*
      - bugfix/*

pr:
  branches:
    include:
      - main
      - feature/*
      - bugfix/*

pool:
  vmImage: ubuntu-latest

variables:
- group: birknext-ci

steps:
- checkout: self
  clean: true

- bash: |
    echo "Branch: $(Build.SourceBranch)"
    echo "Commit: $(Build.SourceVersion)"
    echo "Agent: $(Agent.Name)"
    echo "RUN_TESTS=$(RUN_TESTS)"
    echo "BUILD_BACKEND=$(BUILD_BACKEND)"
    echo "BUILD_FRONTEND=$(BUILD_FRONTEND)"
    echo "PUBLISH_TESTER_PACKAGE=$(PUBLISH_TESTER_PACKAGE)"
  displayName: 'Pipeline configuration'

- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: sdk
    version: '8.0.x'

- bash: |
    set -e
    cat > AIAssisted/.env << EOF
    POSTGRES_DB=$(POSTGRES_DB)
    POSTGRES_USER=$(POSTGRES_USER)
    POSTGRES_PASSWORD=$(POSTGRES_PASSWORD)
    EOF
    echo "Created AIAssisted/.env"
  displayName: 'Create CI .env'

- bash: |
    set -e
    docker compose up -d
    docker compose ps
  displayName: 'Start PostgreSQL container'
  workingDirectory: AIAssisted

- bash: |
    set -e
    echo "Waiting for PostgreSQL healthcheck..."

    for i in {1..30}; do
      HEALTH=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q postgres) 2>/dev/null || echo "unknown")
      echo "Attempt $i: PostgreSQL health = $HEALTH"

      if [ "$HEALTH" = "healthy" ]; then
        echo "PostgreSQL is healthy"
        docker compose ps
        exit 0
      fi

      sleep 5
    done

    echo "PostgreSQL did not become healthy in time"
    docker compose logs postgres
    docker compose ps
    exit 1
  displayName: 'Wait for PostgreSQL'
  workingDirectory: AIAssisted

# -------------------------
# Backend
# -------------------------

- script: dotnet restore BirkNext.sln
  displayName: 'Restore backend solution'
  workingDirectory: AIAssisted/backend
  condition: eq(variables['BUILD_BACKEND'], 'true')

- script: dotnet build BirkNext.sln --configuration Release --no-restore
  displayName: 'Build backend solution'
  workingDirectory: AIAssisted/backend
  condition: eq(variables['BUILD_BACKEND'], 'true')

- script: |
    dotnet test BirkNext.sln \
      --configuration Release \
      --no-build \
      --logger trx \
      --results-directory $(Agent.TempDirectory)/test-results/backend
  displayName: 'Run backend tests'
  workingDirectory: AIAssisted/backend
  condition: and(eq(variables['BUILD_BACKEND'], 'true'), eq(variables['RUN_TESTS'], 'true'))
  continueOnError: true

- script: |
    dotnet publish BirkNext.sln \
      --configuration Release \
      --output $(Build.ArtifactStagingDirectory)/tester-package/backend
  displayName: 'Publish backend app'
  workingDirectory: AIAssisted/backend
  condition: eq(variables['BUILD_BACKEND'], 'true')

# -------------------------
# Frontend
# -------------------------

- script: dotnet restore BirkNext.sln
  displayName: 'Restore frontend solution'
  workingDirectory: AIAssisted/frontend
  condition: eq(variables['BUILD_FRONTEND'], 'true')

- script: dotnet build BirkNext.sln --configuration Release --no-restore
  displayName: 'Build frontend solution'
  workingDirectory: AIAssisted/frontend
  condition: eq(variables['BUILD_FRONTEND'], 'true')

- script: |
    dotnet test BirkNext.sln \
      --configuration Release \
      --no-build \
      --logger trx \
      --results-directory $(Agent.TempDirectory)/test-results/frontend
  displayName: 'Run frontend tests'
  workingDirectory: AIAssisted/frontend
  condition: and(eq(variables['BUILD_FRONTEND'], 'true'), eq(variables['RUN_TESTS'], 'true'))
  continueOnError: true

- script: |
    dotnet publish BirkNext.sln \
      --configuration Release \
      --output $(Build.ArtifactStagingDirectory)/tester-package/frontend
  displayName: 'Publish frontend app'
  workingDirectory: AIAssisted/frontend
  condition: eq(variables['BUILD_FRONTEND'], 'true')

# -------------------------
# Test results
# -------------------------

- task: PublishTestResults@2
  displayName: 'Publish test results'
  condition: and(always(), eq(variables['RUN_TESTS'], 'true'))
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '**/*.trx'
    searchFolder: '$(Agent.TempDirectory)/test-results'
    failTaskOnFailedTests: false

# -------------------------
# Tester package
# -------------------------

- bash: |
    set -e

    PACKAGE_DIR="$(Build.ArtifactStagingDirectory)/tester-package"

    echo "Preparing tester package at: $PACKAGE_DIR"

    mkdir -p "$PACKAGE_DIR/scripts"
    mkdir -p "$PACKAGE_DIR/container"
    mkdir -p "$PACKAGE_DIR/test-results"

    echo "Repository root:"
    pwd

    echo "Repository root contents:"
    ls -la

    echo "AIAssisted contents:"
    ls -la AIAssisted

    echo "Scripts folder contents:"
    ls -la scripts

    echo "Copying docker-compose.yml..."
    cp AIAssisted/docker-compose.yml "$PACKAGE_DIR/container/"

    echo "Copying .env.example if available..."
    cp AIAssisted/.env.example "$PACKAGE_DIR/container/" || echo ".env.example not found, skipping"

    echo "Copying local start scripts..."
    cp scripts/start-local.bat "$PACKAGE_DIR/scripts/"
    cp scripts/start-local.ps1 "$PACKAGE_DIR/scripts/"

    echo "Copying test results if available..."
    cp -r $(Agent.TempDirectory)/test-results/* "$PACKAGE_DIR/test-results/" || echo "No test results found, skipping"

    echo "Creating README..."
    cat > "$PACKAGE_DIR/README.md" << 'EOF'
    # BirkNext Studio Tester Package

    Download this artifact and unzip it.

    ## Included

    - backend/
    - frontend/
    - container/docker-compose.yml
    - scripts/start-local.bat
    - scripts/start-local.ps1
    - test-results/, if tests were run

    ## Requirements

    - Docker Desktop or Podman Desktop
    - .NET 8 runtime, if running the published apps directly

    ## Start locally

    Use:

    scripts/start-local.bat

    or:

    scripts/start-local.ps1

    ## Notes

    Do not commit real .env values.
    EOF

    echo "Final tester package contents:"
    find "$PACKAGE_DIR" -maxdepth 4 -type f -print
  displayName: 'Prepare tester package'
  condition: eq(variables['PUBLISH_TESTER_PACKAGE'], 'true')

- task: PublishPipelineArtifact@1
  displayName: 'Publish tester package'
  condition: eq(variables['PUBLISH_TESTER_PACKAGE'], 'true')
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/tester-package'
    artifact: 'birknext-tester-package'
    publishLocation: 'pipeline'

- task: PublishBuildArtifacts@1
  displayName: 'Publish test artifacts'
  condition: and(always(), eq(variables['RUN_TESTS'], 'true'))
  inputs:
    PathtoPublish: '$(Agent.TempDirectory)/test-results'
    ArtifactName: 'test-results'
    publishLocation: Container

# -------------------------
# Cleanup
# -------------------------

- bash: |
    docker compose down -v
  displayName: 'Cleanup containers'
  condition: always()
  workingDirectory: AIAssisted