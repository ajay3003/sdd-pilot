name: qa-review-studio-ci

on:
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
      - "008-traceability-first"
  pull_request:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
  workflow_dispatch:

# Least privilege: the jobs only read the repository; artifacts use the run's own artifact token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # setup-dotnet installs 8.0.x NEXT TO the SDKs already on the runner image, and without a global.json `dotnet` uses the newest one.
      # The ubuntu images of 2026-11-11 added SDK 11.0.100, and from then on the Razor build failed on unchanged sources. Azure DevOps is
      # not affected: UseDotNet@2 installs into its own tool directory, so only 8.0.x is visible there. Pin this job to the SDK installed
      # above (rollForward disabled) so both pipelines compile with the same toolchain; fail loudly if the pin does not take effect.
      - name: Pin the .NET 8 SDK for this job
        run: |
          set -euo pipefail
          sdk="${{ steps.setup-dotnet.outputs.dotnet-version }}"
          if [ -e global.json ]; then echo "A committed global.json exists; this step must not overwrite it."; exit 1; fi
          case "$sdk" in 8.0.*) ;; *) echo "setup-dotnet reported '$sdk', expected an 8.0 SDK."; exit 1 ;; esac
          printf '{\n  "sdk": {\n    "version": "%s",\n    "rollForward": "disable"\n  }\n}\n' "$sdk" > global.json
          actual="$(dotnet --version)"
          echo "Pinned .NET SDK: $actual (installed SDKs below)"
          dotnet --list-sdks
          test "$actual" = "$sdk"

      # Tests are intentionally not executed in CI. Restore, compilation, and publish remain enabled.
      - name: Restore backend solution
        working-directory: AIAssisted/backend
        run: dotnet restore BirkNext.sln

      - name: Validate migration file integrity (every migrations folder) and record migration ids
        run: pwsh -NoProfile -File scripts/tests/BirkNextPreflight.Tests.ps1 && pwsh -NoProfile -File scripts/tests/BirkNextPackageHiddenFiles.Tests.ps1 && pwsh -NoProfile -File scripts/tests/BirkNextBlazorIntegrity.Tests.ps1 && pwsh -NoProfile -File scripts/check-migrations.ps1 -ManifestOut "${{ runner.temp }}/migrations.json"

      - name: Build backend solution
        working-directory: AIAssisted/backend
        run: dotnet build BirkNext.sln --configuration Release --no-restore

      - name: Check for stale frontend scoped CSS bundle
        run: |
          set -euo pipefail
          file="AIAssisted/frontend/BirkNext.Web/wwwroot/BirkNext.Web.styles.css"
          if [ -f "$file" ]; then
            echo "Stale generated scoped CSS bundle found at $file. Remove it before building."
            exit 1
          fi

      - name: Restore frontend solution
        working-directory: AIAssisted/frontend
        run: dotnet restore BirkNext.sln

      - name: Build frontend solution
        working-directory: AIAssisted/frontend
        run: dotnet build BirkNext.sln --configuration Release --no-restore

      - name: Prepare runnable artifact directories
        run: |
          set -euo pipefail
          package_dir="${GITHUB_WORKSPACE}/artifact/BirkNext"
          rm -rf "$package_dir"
          mkdir -p "$package_dir/AIAssisted/backend" "$package_dir/AIAssisted/frontend" "$package_dir/scripts"

      - name: Publish BirkNext backend
        working-directory: AIAssisted/backend
        run: >-
          dotnet publish BirkNext.Api/BirkNext.Api.csproj
          --configuration Release
          --no-restore
          --output "${GITHUB_WORKSPACE}/artifact/BirkNext/AIAssisted/backend"

      - name: Publish BirkNext Blazor WebAssembly frontend
        working-directory: AIAssisted/frontend
        run: >-
          dotnet publish BirkNext.Web/BirkNext.Web.csproj
          --configuration Release
          --no-restore
          --output "${GITHUB_WORKSPACE}/artifact/BirkNext/AIAssisted/frontend"

      - name: Package local startup support and verify runnable output
        run: |
          set -euo pipefail
          package_dir="${GITHUB_WORKSPACE}/artifact/BirkNext"
          backend="$package_dir/AIAssisted/backend"
          frontend="$package_dir/AIAssisted/frontend/wwwroot"

          # Do not distribute workstation-specific environment profiles.
          rm -f "$backend/appsettings.Development.json" "$backend/appsettings.Local.json"
          cp AIAssisted/docker-compose.yml "$package_dir/AIAssisted/"
          cp AIAssisted/.env.example "$package_dir/AIAssisted/.env.example"
          cp AIAssisted/.env.example "$package_dir/AIAssisted/.env"
          cp scripts/start-local.bat scripts/start-local.ps1 scripts/BirkNextPreflight.psm1 scripts/check-migrations.ps1 scripts/validate-package.ps1 "$package_dir/scripts/"
          cp AIAssisted/backend/MIGRATION_GUIDE.md "$package_dir/"

          cat > "$package_dir/README.md" <<'EOF'
          # BirkNext runnable package

          This package contains the published BirkNext backend and Blazor WebAssembly frontend.

          ## Local requirements

          - .NET 8 runtime
          - Docker Compose or Podman Compose for the local PostgreSQL container
          - Internet access on first startup if `dotnet-serve` is not already installed; the startup helper installs it to serve the static frontend

          ## Start

          From the extracted package directory, run `scripts/start-local.bat` (or `scripts/start-local.ps1`). Prerequisites: Windows, the .NET 8 ASP.NET Core Runtime, and either Podman Desktop or Docker Desktop for the database (whichever is installed and running is used automatically; force one with `-ContainerRuntime podman|docker` or `BIRKNEXT_CONTAINER_RUNTIME`). With PostgreSQL already running on port 5432, use `-SkipContainers`. Missing prerequisites are explained before anything starts. When the browser asks to connect, enter the connection code shown in the start window.

          The package includes `AIAssisted/.env` with the checked-in local development defaults. Change those values before using a shared or exposed database. No developer secrets or machine-specific settings are packaged.

          The helper first validates this package (`scripts/validate-package.ps1`: launcher, backend and frontend runtime, configuration templates, every packaged file, and every EF Core migration compiled into `BirkNext.Api.dll`), then starts PostgreSQL, runs `AIAssisted/backend/BirkNext.Api.dll`, and serves `AIAssisted/frontend/wwwroot` on port 5173. The package needs no source `Data/Migrations` folder.

          Extract the package to a short folder (for example `C:\BirkNext`): Windows limits file paths to 260 characters.
          EOF

          test -s "$backend/BirkNext.Api.dll"
          test -s "$backend/BirkNext.Api.deps.json"
          test -s "$backend/BirkNext.Api.runtimeconfig.json"
          test -s "$backend/appsettings.json"
          test ! -e "$backend/appsettings.Development.json"
          test ! -e "$backend/appsettings.Local.json"
          test -s "$frontend/index.html"
          test -d "$frontend/_framework"
          find "$frontend/_framework" -type f -print -quit | grep -q .
          test -s "$package_dir/AIAssisted/docker-compose.yml"
          test -s "$package_dir/AIAssisted/.env"
          test -s "$package_dir/scripts/start-local.ps1"
          test -s "$package_dir/scripts/check-migrations.ps1"
          test -s "$package_dir/scripts/validate-package.ps1"
          pwsh -NoProfile -File "$package_dir/scripts/validate-package.ps1" -CreateManifest \
            -MigrationManifest "${{ runner.temp }}/migrations.json" -SourceCommit "${GITHUB_SHA}"
          clean_dir="${{ runner.temp }}/package-clean"
          rm -rf "$clean_dir" && mkdir -p "$clean_dir"
          cp -r "$package_dir" "$clean_dir/"
          pwsh -NoProfile -File "$clean_dir/BirkNext/scripts/validate-package.ps1" -PackageRoot "$clean_dir/BirkNext"
          # The upload below includes hidden files; only the allowlisted ones may exist (.env = the checked-in template, .env.example,
          # the Playwright driver), and no workstation settings, keys or repository metadata.
          pwsh -NoProfile -File scripts/check-package-hidden-files.ps1 -PackageRoot "$package_dir" -EnvTemplate AIAssisted/.env.example
          echo "Runnable artifact verified; files: $(find "$package_dir" -type f | wc -l)"

      # INTERNAL intermediate (not for testers), as in azure-pipelines.yml: the framework-dependent developer package that the Windows smoke
      # job below validates. Testers use the self-contained BirkNext-Tester-Windows-x64 artifact, which only Azure DevOps builds.
      # include-hidden-files: upload-artifact@v4 (>= 4.4) silently drops dotfiles and dot-folders, i.e. AIAssisted/.env, .env.example and the
      # backend's Playwright driver (.playwright/, ~337 files). The package manifest lists them, so the smoke job's validate-package.ps1
      # failed with "Local environment defaults is missing (AIAssisted/.env)". Azure's PublishPipelineArtifact keeps them. The hidden files
      # are the same checked-in defaults and runtime files Azure DevOps publishes; no secrets.
      - name: Upload BirkNext developer package candidate (internal)
        uses: actions/upload-artifact@v4
        with:
          name: birknext-tester-package-candidate
          path: artifact/BirkNext
          include-hidden-files: true
          if-no-files-found: error

  smoke-test-tester-package:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Install .NET SDK (the launcher requires dotnet)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download tester package candidate
        uses: actions/download-artifact@v4
        with:
          name: birknext-tester-package-candidate
          path: candidate

      - name: Validate the package and the launcher preflight from a clean folder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $clean = "C:\bn-smoke"
          if (Test-Path $clean) { Remove-Item -Recurse -Force $clean }
          Copy-Item -Recurse "candidate" $clean
          powershell -NoProfile -ExecutionPolicy Bypass -File "$clean\scripts\validate-package.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Tester package validation failed." }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$clean\scripts\start-local.ps1" -ValidateOnly -SkipContainers
          if ($LASTEXITCODE -ne 0) { throw "start-local.ps1 -ValidateOnly failed on the tester package." }

      # (This job used to re-upload the validated folder as 'birknext-tester-package': a byte-identical copy of the candidate that testers
      # mistook for the tester download. Azure DevOps stopped publishing it; this workflow follows the same artifact contract.)
