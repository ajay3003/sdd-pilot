name: qa-review-studio-ci

on:
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
      - "008-traceability-first"
  pull_request:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Tests are intentionally not executed in CI. Restore, compilation, and publish remain enabled.
      - name: Restore backend solution
        working-directory: AIAssisted/backend
        run: dotnet restore BirkNext.sln

      - name: Validate migration file integrity
        run: pwsh -NoProfile -File scripts/check-migrations.ps1

      - name: Build backend solution
        working-directory: AIAssisted/backend
        run: dotnet build BirkNext.sln --configuration Release --no-restore

      - name: Check for stale frontend scoped CSS bundle
        run: |
          set -euo pipefail
          file="AIAssisted/frontend/BirkNext.Web/wwwroot/BirkNext.Web.styles.css"
          if [ -f "$file" ]; then
            echo "Stale generated scoped CSS bundle found at $file. Remove it before building."
            exit 1
          fi

      - name: Restore frontend solution
        working-directory: AIAssisted/frontend
        run: dotnet restore BirkNext.sln

      - name: Build frontend solution
        working-directory: AIAssisted/frontend
        run: dotnet build BirkNext.sln --configuration Release --no-restore

      - name: Prepare runnable artifact directories
        run: |
          set -euo pipefail
          package_dir="${GITHUB_WORKSPACE}/artifact/BirkNext"
          rm -rf "$package_dir"
          mkdir -p "$package_dir/AIAssisted/backend" "$package_dir/AIAssisted/frontend" "$package_dir/scripts"

      - name: Publish BirkNext backend
        working-directory: AIAssisted/backend
        run: >-
          dotnet publish BirkNext.Api/BirkNext.Api.csproj
          --configuration Release
          --no-restore
          --output "${GITHUB_WORKSPACE}/artifact/BirkNext/AIAssisted/backend"

      - name: Publish BirkNext Blazor WebAssembly frontend
        working-directory: AIAssisted/frontend
        run: >-
          dotnet publish BirkNext.Web/BirkNext.Web.csproj
          --configuration Release
          --no-restore
          --output "${GITHUB_WORKSPACE}/artifact/BirkNext/AIAssisted/frontend"

      - name: Package local startup support and verify runnable output
        run: |
          set -euo pipefail
          package_dir="${GITHUB_WORKSPACE}/artifact/BirkNext"
          backend="$package_dir/AIAssisted/backend"
          frontend="$package_dir/AIAssisted/frontend/wwwroot"

          # Do not distribute workstation-specific environment profiles.
          rm -f "$backend/appsettings.Development.json" "$backend/appsettings.Local.json"
          cp AIAssisted/docker-compose.yml "$package_dir/AIAssisted/"
          cp AIAssisted/.env.example "$package_dir/AIAssisted/.env.example"
          cp AIAssisted/.env.example "$package_dir/AIAssisted/.env"
          cp scripts/start-local.bat scripts/start-local.ps1 scripts/check-migrations.ps1 "$package_dir/scripts/"
          cp AIAssisted/backend/MIGRATION_GUIDE.md "$package_dir/"

          cat > "$package_dir/README.md" <<'EOF'
          # BirkNext runnable package

          This package contains the published BirkNext backend and Blazor WebAssembly frontend.

          ## Local requirements

          - .NET 8 runtime
          - Docker Compose or Podman Compose for the local PostgreSQL container
          - Internet access on first startup if `dotnet-serve` is not already installed; the startup helper installs it to serve the static frontend

          ## Start

          From the extracted package directory, run `scripts/start-local.ps1`. To select Docker explicitly, run `scripts/start-local.ps1 -ContainerRuntime docker`.

          The package includes `AIAssisted/.env` with the checked-in local development defaults. Change those values before using a shared or exposed database. No developer secrets or machine-specific settings are packaged.

          The helper starts PostgreSQL, runs the backend migration integrity preflight and `AIAssisted/backend/BirkNext.Api.dll`, and serves `AIAssisted/frontend/wwwroot` on port 5173.
          EOF

          test -s "$backend/BirkNext.Api.dll"
          test -s "$backend/BirkNext.Api.deps.json"
          test -s "$backend/BirkNext.Api.runtimeconfig.json"
          test -s "$backend/appsettings.json"
          test ! -e "$backend/appsettings.Development.json"
          test ! -e "$backend/appsettings.Local.json"
          test -s "$frontend/index.html"
          test -d "$frontend/_framework"
          find "$frontend/_framework" -type f -print -quit | grep -q .
          test -s "$package_dir/AIAssisted/docker-compose.yml"
          test -s "$package_dir/AIAssisted/.env"
          test -s "$package_dir/scripts/start-local.ps1"
          test -s "$package_dir/scripts/check-migrations.ps1"
          echo "Runnable artifact verified; files: $(find "$package_dir" -type f | wc -l)"

      - name: Upload BirkNext runnable artifact
        uses: actions/upload-artifact@v4
        with:
          name: birknext-tester-package
          path: artifact/BirkNext
